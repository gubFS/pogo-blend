schema_version = "1.0.0"

id = "pogo_blend"
version = "0.0.1"
name = "Pogo Blend"
tagline = "An extension for creating Pogostuck custom maps using Blender"
maintainer = "gub"
# Supported types: "add-on", "theme"
type = "add-on"

# # Optional: tag list defined by Blender and server, see:
# # https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
# tags = ["Animation", "Sequencer"]

blender_version_min = "4.5.0"

platforms = [
  "windows-x64",
  "macos-arm64",
  "linux-x64"
]

wheels = [
  "./wheels/pillow-12.0.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.0.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.0.0-cp313-cp313-win_amd64.whl",
  "./wheels/xxhash-3.6.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/xxhash-3.6.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/xxhash-3.6.0-cp313-cp313-win_amd64.whl"
]

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
# https://docs.blender.org/manual/en/dev/advanced/extensions/licenses.html
license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Export files to CustomMap folder"
