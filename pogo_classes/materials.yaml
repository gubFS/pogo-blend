ndef:
  name: ""
  description: No Material
  id: 0
  ambient: Brightness
  albedo: Transparency

appAGeoDefault_mat:
  name: Geometry
  description: The default material for regular geometry
  ambient: Brightness
  albedo: Greyscale
cmFruitTex_mat:
  name: Fruit Tex
  description: Like 'Geometry' but... fruit? Works well with textured entities
  ambient: Brightness
  albedo: Greyscale
fruitTex_mat:
  name: Fruit Tex Reflective
  description: Like 'Fruit Tex' but more reflective
  ambient: Brightness
map3FruitDefault_mat:
  name: Fruit
  description: '"Fruity" material'
  ambient: Brightness
  albedo: Greyscale
cmUnlit:
  name: Unlit
  description: Unlit material
  albedo: Transparency
cmPixelated:
  name: Pixelated
  description: Shows the texture with no modificaitons. Specifically texture filtering, so this material is good for showing pixel art
  albedo: Transparency
characterSimple_mat:
  name: Character
  description: Bright and high contrast material
  ambient: Brightness

wood_mat:
  name: Wood
  description: Wood material
pogostickGold_mat:
  name: Gold
  description: Gold material
mymetal_mat:
  name: Metal
  description: Glossy metal material
  ambient: Brightness

iceSnow_mat:
  name: Ice
  description: Looks like ice
map3ClothBee_mat:
  name: Bee
  description: Looks like the hair on the bees
map3GrassFruit_mat:
  name: Moss
  description: Uses a second UV Map to add moss to the entity. Any UV-cordinate on the second UV Map, that has an X-value greater than 1 becomes mossy
kuXGravity_mat:
  name: Gravity
  description: Uses two UV Maps to display a gravity material as seen in Custom Map X. The first UV Map chooses the direction flow and speed of the particles. It looks best when all the UV Points are in the same position. The particles will be pulled towards the top left corner of the UV Map, but the Y-axis is flipped. The second UV Map determines how the galaxy background and colors appear
  transparent: true
gravityPull_mat:
  name: Gravity Pull
  description: Pulls the texture (needs a texture!) towards the center of the UV Map with a purple hue. Like Plums in Map 2
  transparent: true
waterFG_mat:
  name: Water
  description: Looks like reflective water. It mirrors where Z=0. To have the mirror-axis occur at the top of the entity, use the "Water Visual" action
appAFog_mat:
  name: Fog
  description: Turns the texture transparent and greyscale, with a stack of the texture moving across it slowly
  transparent: true

appAGeoXRay_mat:
  name: XRay Geometry
  description: Hiddes the entity when the players comes too close. Otherwise same as 'Geometry' material
  ambient: Brightness
  albedo: Greyscale
toggleBlock_mat:
  name: Toggle Block
  description: Should be used with the 'Toggle Block' action. Dithers the entity
  ambient: Brightness

slime_mat:
  name: Sap
  description: Used for regular sap. Scrolls the texture. Use the 'Slime Bubbles' texture to get the regular sap look
  transparent: true
pinkSap_mat:
  name: Pink Sap
  description: Used for the pink sap. Scrolls the texture. Use the 'Slime Bubbles' texture to get the regular pink sap look
  transparent: true
map3GoldSlime_mat:
  name: Boost Juice
  description: Used for boost juice. Looks like gold. Scrolls the texture. Use the 'Slime Bubbles' texture to get the regular boost juice look

snowFG_mat:
  name: Falling
  description: Scrolls multiple copies of the texture downwards. Can be used to make snow fall or other particles
cmNormalmapping:
  name: Normal Mapping
  description: Uses the second texture on the entity as a normal map.

fruit_mat:
  name: Fruit1
  description: Main material used in Map 1
  ambient: Brightness
map3FruitTex_mat:
  name: Fruit Tex Mirrored
  description: Same as 'Fruit Tex' but mirrors tiling textures
