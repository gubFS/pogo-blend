name: "Sphinx: Render docs"

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'pogo_classes/**/**.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Build HTML
      uses: gubfs/sphinx-action@master
      with:
        docs-folder: "docs/"
        pre-build-command: "find /etc/apt/sources.list.d -name '*.sources' -exec sed -i 's/bookworm/trixie/g' {} \\; && apt-get update -y && apt-get install -y just"
        build-command: "just build-docs"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: html-docs
        path: docs/_build/html/
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html
